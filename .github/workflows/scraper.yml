name: Uber Eats Vegan Deal Finder

on:
  schedule:
    - cron: '0 13,20 * * *'
  workflow_dispatch: {} # manual override for testing; no inputs needed

permissions:
  contents: write

jobs:
  scrape:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run scraper
        run: node scrape.js

      - name: Upload debug snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-snapshots-${{ github.run_number }}
          path: debug/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit and push deals.md
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
          } else {
            $timestamp = Get-Date -AsUTC -Format "yyyy-MM-dd HH:mm 'UTC'"
            git commit -m "Update vegan deals ($timestamp)"
            git push
          }
